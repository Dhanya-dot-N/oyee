<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>oyeee</title>
<style>
  :root { --bg:#FBF8F5; --ink:#2B2B33; --muted:#7b7b88; --peach:#F9D9BE; --lav:#DCD3FA; --pink:#F5D0E0; --accent:#8B7CF6; --line:#ece5de; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:'Segoe UI',sans-serif; color:var(--ink); height:100vh;
    background: radial-gradient(ellipse 120% 40% at 50% 108%, rgba(139,124,246,.35), rgba(249,217,190,.35) 55%, transparent 80%) no-repeat, var(--bg); }
  #app { display:flex; flex-direction:column; height:100vh; padding:14px 16px 16px; }
  header { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  header h1 { flex:1; margin:0; font-family:Georgia,serif; font-weight:400; font-size:26px; letter-spacing:-.5px; }
  select, input, textarea { font:inherit; font-size:14px; color:var(--ink); background:#fff; border:1px solid var(--line); border-radius:12px; padding:8px 10px; outline:none; }
  input:focus, textarea:focus, select:focus { border-color:var(--accent); }
  button { font:inherit; cursor:pointer; border:none; }
  .icon { width:36px; height:36px; border-radius:12px; background:#fff; border:1px solid var(--line); display:grid; place-items:center; color:var(--ink); }
  .btn { background:#1f1f26; color:#fff; border-radius:999px; padding:9px 18px; font-size:14px; }
  .btn.ghost { background:#fff; color:var(--ink); border:1px solid var(--line); }
  svg { display:block; }

  .view { display:none; flex:1; flex-direction:column; min-height:0; }
  .view.show { display:flex; }

  /* home */
  .hello { font-family:Georgia,serif; font-size:24px; line-height:1.2; margin:8px 2px 14px; }
  .hello small { display:block; font-family:'Segoe UI',sans-serif; font-size:13px; color:var(--muted); margin-top:6px; }
  .cards { flex:1; display:flex; flex-direction:column; gap:12px; min-height:0; }
  .card { flex:1; display:flex; align-items:center; gap:14px; text-align:left; border-radius:24px; padding:0 18px; color:var(--ink); transition:transform .15s; max-height:130px; }
  .card:hover { transform:translateY(-2px); }
  .card .ic { width:46px; height:46px; border-radius:16px; background:rgba(255,255,255,.65); display:grid; place-items:center; flex:none; }
  .card b { display:block; font-family:Georgia,serif; font-weight:400; font-size:20px; }
  .card span { font-size:13px; color:#5d5d6b; }
  .c-nudge { background:var(--peach); } .c-talk { background:var(--lav); } .c-know { background:var(--pink); }

  /* talk */
  .bar { display:flex; align-items:center; gap:10px; margin-bottom:6px; }
  .bar h3 { margin:0; font-family:Georgia,serif; font-weight:400; font-size:20px; }
  #log { flex:1; overflow-y:auto; padding:4px 2px; min-height:0; }
  .msg { margin:8px 0; padding:10px 14px; border-radius:18px; max-width:86%; line-height:1.4; font-size:15px; white-space:pre-wrap; }
  .me { background:var(--lav); margin-left:auto; border-bottom-right-radius:6px; }
  .mate { background:#fff; box-shadow:0 2px 10px rgba(80,60,120,.08); border-bottom-left-radius:6px; }
  .chip { margin:8px 6px 0 0; background:var(--bg); border:1px solid var(--line); border-radius:999px; padding:6px 12px; font-size:13px; }
  .chip:disabled { opacity:.6; cursor:default; }
  .dock { display:flex; flex-direction:column; align-items:center; gap:10px; padding-top:8px; }
  .mic { width:68px; height:68px; border-radius:50%; background:linear-gradient(135deg,#9d8ff8,#7b6cf0); color:#fff; display:grid; place-items:center; box-shadow:0 8px 22px rgba(139,124,246,.45); }
  .mic .i-stop, .mic .i-wait { display:none; }
  .mic.rec { animation:pulse 1.3s infinite; } .mic.rec .i-mic { display:none; } .mic.rec .i-stop { display:block; }
  .mic.wait { opacity:.8; } .mic.wait .i-mic { display:none; } .mic.wait .i-wait { display:block; animation:spin 1s linear infinite; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(139,124,246,.55)} 100%{box-shadow:0 0 0 20px rgba(139,124,246,0)} }
  @keyframes spin { to { transform:rotate(360deg); } }
  .typed { display:flex; gap:8px; width:100%; }
  .typed input { flex:1; }

  /* sheets: Know Me + Calendar */
  .sheet { display:none; position:fixed; inset:0; background:var(--bg); overflow-y:auto; padding:16px; z-index:10; }
  .sheet.open { display:block; }
  .sheet h4 { margin:16px 0 6px; font-size:13px; color:var(--muted); font-weight:600; }
  .sheet textarea, .sheet input { width:100%; margin:3px 0; }
  .km-row { background:#fff; border-radius:18px; padding:10px; margin:10px 0; box-shadow:0 2px 10px rgba(80,60,120,.06); }
  .km-ex { font-weight:600; }
  .km-del { background:none; color:var(--muted); font-size:13px; padding:6px 4px; }
  #kmMsg { margin-left:8px; color:var(--accent); font-size:14px; }
  .hint { font-size:13px; color:var(--muted); margin:4px 0 0; }
  .cal-dh { margin:16px 0 6px; font-size:13px; color:var(--muted); }
  .cal-dh.today { color:var(--accent); font-weight:700; }
  .cal-empty { font-size:13px; color:#a9a9b5; padding:2px 0 4px; }
  .cal-ev { display:flex; gap:10px; align-items:center; background:#fff; border-left:4px solid var(--accent); border-radius:14px; padding:10px 12px; margin:6px 0; box-shadow:0 2px 10px rgba(80,60,120,.06); }
  .cal-ev.nudged { border-left-color:#f59f00; } .cal-ev.started { border-left-color:#37b24d; } .cal-ev.paused { border-left-color:#b5b5c0; opacity:.65; }
  .cal-t { font-size:13px; color:var(--muted); min-width:62px; } .cal-n { flex:1; }
  .cal-x { background:none; color:var(--muted); padding:2px 6px; }
  .mic.mini { width:40px; height:40px; flex:none; box-shadow:0 4px 12px rgba(139,124,246,.4); }
  .vf { display:flex; gap:8px; align-items:center; margin:4px 0; }
  .sheet .vf input, .sheet .vf textarea { width:auto; flex:1; min-width:0; margin:0; }
  .km-row { padding:0; overflow:hidden; }
  .km-head { display:flex; width:100%; align-items:center; justify-content:space-between; gap:8px; background:none; padding:12px 14px; font-size:15px; font-weight:600; color:var(--ink); text-align:left; }
  .km-title { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .km-body { padding:0 12px 12px; }
  .km-row.collapsed .km-body { display:none; }
  .km-lab { font-size:12px; color:var(--muted); margin:8px 0 2px; }
  .km-bar { display:flex; gap:8px; align-items:center; margin:8px 0; }
  .cal-t { background:none; padding:0; text-align:left; color:var(--accent); font-weight:600; }
  .cal-t:disabled { color:var(--muted); font-weight:400; }
  .cal-act { background:#1f1f26; color:#fff; border-radius:999px; padding:6px 14px; font-size:13px; }
  .cal-act.ghost { background:#fff; color:var(--ink); border:1px solid var(--line); }
  .cal-act.done { background:var(--accent); }
  .cal-ok { font-size:13px; color:#37b24d; }
  .cal-err { font-size:12px; color:#e03131; }
  .sheet .cal-in { width:auto; flex:1; min-width:0; margin:0; }
  .cal-ev.done { border-left-color:#37b24d; opacity:.6; }
  .cal-ev.done .cal-n { text-decoration:line-through; color:var(--muted); }

</style>
</head>
<body>
<div id="app">
  <header>
    <h1>oyeee</h1>
    <select id="lang" title="Language"><option>English</option><option>Hindi</option><option>Kannada</option></select>
    <button id="expand" class="icon" title="Resize">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
    </button>
  </header>

  <main id="home" class="view show">
    <div class="hello">Hi! What do you need right now?<small>One small step is enough.</small></div>
    <div class="cards">
      <button id="calBtn" class="card c-nudge">
        <div class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2B2B33" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 01-3.4 0"/></svg></div>
        <div><b>Nudge Me</b><span>Your reminders and calendar</span></div>
      </button>
      <button id="talkBtn" class="card c-talk">
        <div class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2B2B33" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 01-11.6 7.1L3 21l1.9-6A8 8 0 1121 12z"/></svg></div>
        <div><b>Talk to Me</b><span>Say what you're avoiding</span></div>
      </button>
      <button id="kmBtn" class="card c-know">
        <div class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2B2B33" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 00-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 00-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 000-7.8z"/></svg></div>
        <div><b>Know Me</b><span>Your words and your why</span></div>
      </button>
    </div>
  </main>

  <main id="talk" class="view">
    <div class="bar">
      <button id="talkBack" class="icon" title="Back"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <h3>Talk to Me</h3>
    </div>
    <div id="log"></div>
    <div class="dock">
      <button id="mic" class="mic" title="Tap to talk, tap again to stop">
        <svg class="i-mic" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v4"/></svg>
        <svg class="i-stop" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="3"/></svg>
        <svg class="i-wait" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 3a9 9 0 019 9" /></svg>
      </button>
      <div class="typed"><input id="text" placeholder="Or type here..." /><button id="send" class="btn">Send</button></div>
    </div>
  </main>
</div>

<div id="kmOverlay" class="sheet">
  <div class="bar"><button id="kmClose" class="icon" title="Back"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button><h3>Know Me</h3></div>
  <h4>Why I'm doing this</h4>
  <textarea id="kmWhy" rows="2" placeholder="Say it or type it"></textarea>
  <h4>My excuses, and what I'd tell myself</h4>
  <div class="km-bar"><button id="kmAdd" class="btn ghost">+ Add excuse</button><button id="kmSave" class="btn">Save</button><span id="kmMsg"></span></div>
  <div id="kmList"></div>
</div>

<div id="calOverlay" class="sheet">
  <div class="bar"><button id="calClose" class="icon" title="Back"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button><h3>Nudge Me</h3></div>
  <p class="hint">To add one, go to Talk to Me and say it, like "remind me at 6pm to write".</p>
  <div id="calBody"></div>
</div>

<script>
  const log = document.getElementById('log');
  const input = document.getElementById('text');
  const lang = document.getElementById('lang');
  const mic = document.getElementById('mic');
  let large = false, rec = null, busy = false;

  function showView(n) {
    document.getElementById('home').classList.toggle('show', n === 'home');
    document.getElementById('talk').classList.toggle('show', n === 'talk');
    document.querySelectorAll('.sheet.open').forEach((s) => s.classList.remove('open'));
    if (n === 'talk') input.focus();
  }
  document.getElementById('talkBtn').onclick = () => showView('talk');
  document.getElementById('talkBack').onclick = () => showView('home');
  document.getElementById('expand').onclick = () => { large = !large; window.mate.setSize(large ? 'large' : 'small'); };

  function add(text, cls) {
    const d = document.createElement('div');
    d.className = 'msg ' + cls;
    d.textContent = text;
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
    return d;
  }

  async function send() {
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    add(text, 'me');
    const res = await window.mate.ask(text, 'Me', lang.value);
    add(res.error ? 'Something went wrong: ' + res.error : res.reply, 'mate');
  }
  document.getElementById('send').onclick = send;
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });

  function toWav(chunks) {
    const len = chunks.reduce((n, c) => n + c.length, 0);
    const buf = new ArrayBuffer(44 + len * 2);
    const v = new DataView(buf);
    const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
    w(0, 'RIFF'); v.setUint32(4, 36 + len * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, 16000, true); v.setUint32(28, 32000, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
    w(36, 'data'); v.setUint32(40, len * 2, true);
    let o = 44;
    for (const c of chunks) for (let i = 0; i < c.length; i++) {
      const s = Math.max(-1, Math.min(1, c[i]));
      v.setInt16(o, s < 0 ? s * 0x8000 : s * 0x7FFF, true); o += 2;
    }
    return buf;
  }

  async function startRec() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const ctx = new AudioContext({ sampleRate: 16000 });
      const src = ctx.createMediaStreamSource(stream);
      const proc = ctx.createScriptProcessor(4096, 1, 1);
      const chunks = [];
      proc.onaudioprocess = (e) => chunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));
      src.connect(proc); proc.connect(ctx.destination);
      rec = { stream, ctx, src, proc, chunks, timer: setTimeout(stopRec, 20000) };
      mic.className = 'mic rec';
    } catch (e) {
      add('Microphone problem: ' + e.message, 'mate');
    }
  }

  async function stopRec() {
    if (!rec) return;
    const r = rec; rec = null;
    clearTimeout(r.timer);
    r.proc.disconnect(); r.src.disconnect();
    r.stream.getTracks().forEach((t) => t.stop());
    await r.ctx.close();
    handleVoice(toWav(r.chunks));
  }

  async function handleVoice(wav) {
    busy = true; mic.className = 'mic wait';
    const done = () => { busy = false; mic.className = 'mic'; };
    const s = await window.mate.stt(wav, lang.value);
    if (s.error) { add('Something went wrong: ' + s.error, 'mate'); return done(); }
    add(s.text, 'me');
    const res = await window.mate.ask(s.text, 'Me', lang.value);
    if (res.error) { add('Something went wrong: ' + res.error, 'mate'); return done(); }
    add(res.reply, 'mate');
    const t = await window.mate.tts(res.reply, lang.value);
    if (t.error) add('(Voice unavailable: ' + t.error + ')', 'mate');
    else new Audio(URL.createObjectURL(new Blob([t.audio], { type: 'audio/wav' }))).play();
    done();
  }
  mic.onclick = () => { if (busy) return; rec ? stopRec() : startRec(); };

  // notification clicked
  window.mate.onOpen((d) => {
    showView('talk');
    if (d.language) lang.value = d.language;
    const b = add(d.message, 'mate');
    if (!d.id) return;
    const row = document.createElement('div');
    b.appendChild(row);
    const chip = (label) => {
      const c = document.createElement('button');
      c.className = 'chip'; c.textContent = label;
      row.appendChild(c);
      return c;
    };
    const lock = () => row.querySelectorAll('.chip').forEach((x) => (x.disabled = true));

    if (d.check) {
      const done = chip('Done'), still = chip('Still going'), stuck = chip("I'm stuck");
      done.onclick = async () => { await window.mate.c.act(d.id, 'done'); lock(); done.textContent = 'Done \u2713'; };
      still.onclick = async () => { await window.mate.c.act(d.id, 'still'); lock(); still.textContent = 'Okay, keep going \u2713'; };
      stuck.onclick = async () => {
        await window.mate.c.act(d.id, 'stuck'); lock();
        const msg = `I'm stuck on: ${d.task}. Help me with one small next step.`;
        add(msg, 'me');
        const res = await window.mate.ask(msg, 'Me', lang.value, true);
        add(res.error ? 'Something went wrong: ' + res.error : res.reply, 'mate');
        if (!res.error) {
          const t = await window.mate.tts(res.reply, lang.value);
          if (!t.error) new Audio(URL.createObjectURL(new Blob([t.audio], { type: 'audio/wav' }))).play().catch(() => {});
        }
      };
      return;
    }

    const start = chip('Start');
    const snooze = chip('Remind me in 1 hour');
    start.onclick = async () => {
      await window.mate.c.act(d.id, 'started');
      start.textContent = 'Started \u2713'; start.disabled = true; snooze.remove();
      setTimeout(() => {
        start.remove();
        const done = chip('Done');
        done.onclick = async () => { await window.mate.c.act(d.id, 'done'); done.textContent = 'Done \u2713'; done.disabled = true; };
      }, 1400);
    };
    snooze.onclick = async () => {
      await window.mate.c.act(d.id, 'snooze');
      snooze.textContent = 'Okay, in 1 hour \u2713'; snooze.disabled = true; start.disabled = true;
    };
  });

  // spoken reminder
  window.mate.onSpeak(async (d) => {
    const t = await window.mate.tts(d.text, d.language);
    if (!t.error) new Audio(URL.createObjectURL(new Blob([t.audio], { type: 'audio/wav' }))).play().catch(() => {});
  });
  
</script>
<script src="knowme-ui.js"></script>
<script src="calendar-ui.js"></script>
</body>
</html>
